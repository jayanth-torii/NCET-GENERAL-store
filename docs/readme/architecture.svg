<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">Architecture</title>
  <desc id="d">Counter browsers, the rush tablet and the office PC talk to one NestJS API server over the store network; the API keeps all business rules and stores data in MongoDB Atlas with transactions, an id sequence and append-only ledgers.</desc>
  <style>
    .box{fill:#fff;stroke:#d4d4d4}
    .h{font:700 16px 'Segoe UI',Inter,Arial,sans-serif;fill:#0a0a0a}
    .p{font:500 12.5px 'Segoe UI',Inter,Arial,sans-serif;fill:#525252}
    .tag{font:700 11px 'Segoe UI',Inter,Arial,sans-serif;fill:#0F4C81}
    .flow{fill:none;stroke:#4a9bd4;stroke-width:2.5;stroke-dasharray:6 10;animation:flow 1.1s linear infinite}
    .back{stroke:#22c55e;animation-direction:reverse;animation-duration:1.4s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    .node{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards}
    .n2{animation-delay:.2s}.n3{animation-delay:.4s}.n4{animation-delay:.6s}.n5{animation-delay:.8s}
    @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .ring{fill:none;stroke:#22c55e;animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.6)}}
    .dot{animation:dot 2s ease-in-out infinite}
    @keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
    @media (prefers-color-scheme: dark){.box{fill:#161b22;stroke:#30363d}.h{fill:#f0f6fc}.p{fill:#c9d1d9}.tag{fill:#84bde4}.bgr{fill:#0d1117}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.node{opacity:1}}
  </style>
  <rect class="bgr" width="1200" height="430" rx="20" fill="#f8fafc"/>

  <!-- clients -->
  <g class="node"><rect class="box" x="30" y="40" width="250" height="78" rx="14"/><text x="52" y="72" class="h">🧾 Counter 1 · 2 · …</text><text x="52" y="96" class="p">Chrome kiosk-printing, F-keys, 80 mm</text></g>
  <g class="node n2"><rect class="box" x="30" y="176" width="250" height="78" rx="14"/><text x="52" y="208" class="h">📱 Rush-hour tablet</text><text x="52" y="232" class="p">Same app, touch layout</text></g>
  <g class="node n3"><rect class="box" x="30" y="312" width="250" height="78" rx="14"/><text x="52" y="344" class="h">🖥 Office PC</text><text x="52" y="368" class="p">GRNs, reports, GST, masters</text></g>

  <!-- flows clients -> api -->
  <path class="flow" d="M282 79 C 360 79, 380 215, 450 215"/>
  <path class="flow" d="M282 215 L 450 215"/>
  <path class="flow" d="M282 351 C 360 351, 380 215, 450 215"/>
  <path class="flow back" d="M450 235 C 380 235, 360 99, 282 99"/>

  <!-- api -->
  <g class="node n4">
    <rect class="box" x="452" y="120" width="310" height="196" rx="16" stroke="#0F4C81" stroke-width="2"/>
    <rect x="452" y="120" width="310" height="40" rx="16" fill="#0F4C81"/><rect x="452" y="144" width="310" height="16" fill="#0F4C81"/>
    <text x="474" y="146" style="font:700 16px 'Segoe UI',Arial,sans-serif;fill:#fff">⚙ API server · NestJS + Prisma</text>
    <text x="474" y="186" class="p">auth · catalogue · sales · purchase</text>
    <text x="474" y="206" class="p">stock · reports (PDF / Excel) · admin</text>
    <text x="474" y="236" class="tag">PER-ITEM QUEUE  ·  withTx RETRY</text>
    <text x="474" y="258" class="p">sales of one item run one after another,</text>
    <text x="474" y="276" class="p">write conflicts re-run the whole step</text>
    <circle cx="738" cy="140" r="5" fill="#22c55e" class="dot"/>
  </g>

  <!-- api -> mongo -->
  <path class="flow" d="M764 205 L 880 205"/>
  <path class="flow back" d="M880 232 L 764 232"/>

  <!-- mongo -->
  <g class="node n5">
    <rect class="box" x="882" y="70" width="290" height="300" rx="16" stroke="#22c55e" stroke-width="2"/>
    <circle cx="912" cy="104" r="11" fill="#22c55e"/><circle cx="912" cy="104" r="11" class="ring" stroke-width="3"/>
    <text x="934" y="110" class="h">MongoDB Atlas</text>
    <text x="904" y="146" class="tag">REPLICA SET · TRANSACTIONS</text>
    <text x="904" y="172" class="p">29 collections, numeric ids from _seq</text>
    <text x="904" y="194" class="p">bill numbers: doc_counter, in the bill's tx</text>
    <text x="904" y="216" class="p">stock_movement + audit_log: append-only</text>
    <text x="904" y="238" class="p">partial unique: name, barcode, GRN, invoice</text>
    <text x="904" y="260" class="p">money: Decimal maths, stored 4 dp</text>
    <rect x="904" y="284" width="246" height="66" rx="10" fill="#22c55e" fill-opacity="0.1"/>
    <text x="918" y="310" class="tag" style="fill:#15803d">NIGHTLY 02:00 LEDGER CHECK</text>
    <text x="918" y="332" class="p">balance = Σ movements, alert on drift</text>
  </g>
</svg>
