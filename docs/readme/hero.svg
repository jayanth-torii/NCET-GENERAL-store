<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">NCET General Store POS</title>
  <desc id="d">Animated banner: a barcode is scanned, a receipt prints, and the title reads NCET General Store POS, browser point of sale on MongoDB Atlas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2339"/>
      <stop offset="0.55" stop-color="#0F4C81"/>
      <stop offset="1" stop-color="#123759"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4a9bd4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a9bd4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="paperClip"><rect x="880" y="96" width="210" height="250" rx="2"/></clipPath>
    <clipPath id="typeClip"><rect x="60" y="208" width="0" height="40"><animate attributeName="width" from="0" to="640" dur="2.6s" begin="0.9s" fill="freeze"/></rect></clipPath>
    <style>
      .t1{font:700 64px 'Segoe UI',Inter,Arial,sans-serif;fill:#fff;letter-spacing:-1px}
      .t2{font:500 24px 'Segoe UI',Inter,Arial,sans-serif;fill:#b6d8f0}
      .t3{font:600 15px 'Segoe UI',Inter,Arial,sans-serif;fill:#fff}
      .mono{font:600 13px Consolas,'Courier New',monospace;fill:#0c2339}
      .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:3.3s}.d3{animation-delay:3.5s}.d4{animation-delay:3.7s}
      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      .float{animation:float 6s ease-in-out infinite}
      .f2{animation-duration:7.5s;animation-delay:-2s}.f3{animation-duration:9s;animation-delay:-4s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      .scan{animation:scan 2.4s ease-in-out infinite}
      @keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(58px)}}
      .paper{animation:print 3.2s steps(16) .6s forwards;transform:translateY(-250px)}
      @keyframes print{to{transform:translateY(0)}}
      .line{opacity:0;animation:rise .4s ease forwards}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.2s ease-out infinite;transform-origin:1030px 70px}
      @keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}.rise,.line{opacity:1}.paper{transform:none}}
    </style>
  </defs>

  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow)"/>
  <!-- floating store items -->
  <g opacity="0.18" fill="#fff">
    <g class="float"><rect x="560" y="40" width="46" height="60" rx="6"/><rect x="568" y="52" width="30" height="5" rx="2" fill="#0F4C81"/></g>
    <g class="float f2"><circle cx="760" cy="300" r="22"/><circle cx="760" cy="300" r="9" fill="#0F4C81"/></g>
    <g class="float f3"><rect x="650" y="290" width="70" height="26" rx="13"/></g>
    <g class="float f2"><path d="M470 60 l14 -8 l14 8 v18 l-14 8 l-14 -8z"/></g>
  </g>

  <!-- title -->
  <g class="rise d1"><rect x="60" y="64" width="232" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/><circle cx="82" cy="81" r="6" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="96" y="87" class="t3">NCET campus · point of sale</text></g>
  <text x="58" y="180" class="t1 rise d1">NCET General Store</text>
  <g clip-path="url(#typeClip)"><text x="60" y="238" class="t2">Browser billing for every counter · now on MongoDB Atlas</text></g>
  <rect x="700" y="216" width="3" height="28" fill="#b6d8f0" class="caret"/>
  <g class="rise d2"><rect x="60" y="282" width="176" height="40" rx="10" fill="#fff"/><text x="80" y="308" style="font:700 15px 'Segoe UI',Arial,sans-serif;fill:#0F4C81">F10 · Save &amp; print</text></g>
  <g class="rise d3"><rect x="248" y="282" width="138" height="40" rx="10" fill="#fff" fill-opacity="0.12" stroke="#b6d8f0" stroke-opacity="0.4"/><text x="268" y="308" class="t3">UPI QR · F3</text></g>
  <g class="rise d4"><rect x="398" y="282" width="178" height="40" rx="10" fill="#fff" fill-opacity="0.12" stroke="#b6d8f0" stroke-opacity="0.4"/><text x="418" y="308" class="t3">GST · GRN · Reports</text></g>

  <!-- scanner -->
  <g transform="translate(830 40)">
    <rect x="150" y="10" width="110" height="64" rx="10" fill="#0c2339" stroke="#4a9bd4" stroke-opacity="0.6"/>
    <g fill="#fff" opacity="0.85">
      <rect x="166" y="22" width="3" height="40"/><rect x="172" y="22" width="1.5" height="40"/><rect x="177" y="22" width="4" height="40"/><rect x="185" y="22" width="2" height="40"/>
      <rect x="190" y="22" width="5" height="40"/><rect x="199" y="22" width="1.5" height="40"/><rect x="204" y="22" width="3" height="40"/><rect x="211" y="22" width="2" height="40"/>
      <rect x="216" y="22" width="4" height="40"/><rect x="224" y="22" width="1.5" height="40"/><rect x="229" y="22" width="3" height="40"/><rect x="236" y="22" width="5" height="40"/>
    </g>
    <rect x="156" y="14" width="98" height="3" rx="1.5" fill="url(#laser)" class="scan"/>
    <circle cx="200" cy="30" r="10" fill="none" stroke="#4a9bd4" class="pulse"/>
  </g>

  <!-- receipt printing -->
  <rect x="868" y="88" width="234" height="16" rx="8" fill="#0c2339"/>
  <g clip-path="url(#paperClip)">
    <g class="paper">
      <path d="M880 96 h210 v236 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 z" fill="#fff"/>
      <text x="985" y="124" text-anchor="middle" style="font:700 14px 'Segoe UI',Arial,sans-serif;fill:#0F4C81">GENERAL STORE</text>
      <text x="985" y="142" text-anchor="middle" class="mono" style="font-size:11px;fill:#737373">C1/26-27/000481</text>
      <line x1="896" y1="152" x2="1074" y2="152" stroke="#cbd5e1" stroke-dasharray="4 3"/>
      <text x="896" y="174" class="mono">NOTE BOOK 200PG</text><text x="1074" y="174" class="mono" text-anchor="end">5×35</text>
      <text x="896" y="194" class="mono">5 STAR</text><text x="1074" y="194" class="mono" text-anchor="end">5×10</text>
      <text x="896" y="214" class="mono">BLUE BOOK</text><text x="1074" y="214" class="mono" text-anchor="end">2×20</text>
      <line x1="896" y1="226" x2="1074" y2="226" stroke="#cbd5e1" stroke-dasharray="4 3"/>
      <text x="896" y="252" style="font:800 18px 'Segoe UI',Arial,sans-serif;fill:#0c2339">TOTAL</text>
      <text x="1074" y="252" text-anchor="end" style="font:800 18px Consolas,monospace;fill:#0c2339">₹265.00</text>
      <text x="896" y="276" class="mono" style="fill:#16a34a">CASH 300 · CHANGE 35</text>
      <g fill="#0c2339"><rect x="925" y="290" width="2" height="22"/><rect x="930" y="290" width="4" height="22"/><rect x="937" y="290" width="1.5" height="22"/><rect x="942" y="290" width="3" height="22"/><rect x="948" y="290" width="5" height="22"/><rect x="956" y="290" width="2" height="22"/><rect x="961" y="290" width="4" height="22"/><rect x="968" y="290" width="1.5" height="22"/><rect x="973" y="290" width="3" height="22"/><rect x="979" y="290" width="5" height="22"/><rect x="987" y="290" width="2" height="22"/><rect x="992" y="290" width="4" height="22"/><rect x="999" y="290" width="3" height="22"/><rect x="1005" y="290" width="1.5" height="22"/><rect x="1010" y="290" width="4" height="22"/><rect x="1017" y="290" width="2" height="22"/><rect x="1022" y="290" width="5" height="22"/><rect x="1030" y="290" width="2" height="22"/><rect x="1035" y="290" width="3" height="22"/><rect x="1041" y="290" width="1.5" height="22"/></g>
    </g>
  </g>
</svg>
