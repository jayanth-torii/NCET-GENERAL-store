<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
  <title id="t">Verified on MongoDB Atlas: 155 of 155 API checks, 47 of 47 browser checks, 4,633 rows migrated, 0 ledger differences</title>
  <style>
    .card{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
    .c2{animation-delay:.15s}.c3{animation-delay:.3s}.c4{animation-delay:.45s}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .bar{transform:scaleX(0);transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
    .b2{animation-delay:.2s}.b3{animation-delay:.35s}.b4{animation-delay:.5s}
    @keyframes grow{to{transform:scaleX(1)}}
    .num{font:800 36px 'Segoe UI',Inter,Arial,sans-serif;fill:#0F4C81}
    .lab{font:600 14px 'Segoe UI',Inter,Arial,sans-serif;fill:#404040}
    .sub{font:500 12px 'Segoe UI',Inter,Arial,sans-serif;fill:#737373}
    .shine{animation:shine 3.5s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120px)}60%,100%{transform:translateX(300px)}}
    @media (prefers-color-scheme: dark){.num{fill:#84bde4}.lab{fill:#e5e5e5}.sub{fill:#a3a3a3}.bgc{fill:#161b22;stroke:#30363d}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.card{opacity:1}.bar{transform:none}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0F4C81"/><stop offset="1" stop-color="#4a9bd4"/></linearGradient>
    <linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="k1"><rect x="0" y="0" width="282" height="130" rx="16"/></clipPath>
  </defs>
  <g transform="translate(4 10)"><g class="card">
    <rect class="bgc" width="282" height="130" rx="16" fill="#f8fafc" stroke="#e5e5e5"/>
    <g clip-path="url(#k1)"><rect class="shine" x="0" y="0" width="80" height="130" fill="url(#s)"/></g>
    <text x="22" y="52" class="num">155 / 155</text><text x="22" y="76" class="lab">API checks on Atlas</text>
    <rect x="22" y="96" width="238" height="8" rx="4" fill="#e5e5e5"/><rect class="bar" x="22" y="96" width="238" height="8" rx="4" fill="url(#g)"/>
  </g></g>
  <g transform="translate(308 10)"><g class="card c2">
    <rect class="bgc" width="282" height="130" rx="16" fill="#f8fafc" stroke="#e5e5e5"/>
    <text x="22" y="52" class="num">47 / 47</text><text x="22" y="76" class="lab">real-browser checks</text>
    <rect x="22" y="96" width="238" height="8" rx="4" fill="#e5e5e5"/><rect class="bar b2" x="22" y="96" width="238" height="8" rx="4" fill="url(#g)"/>
  </g></g>
  <g transform="translate(612 10)"><g class="card c3">
    <rect class="bgc" width="282" height="130" rx="16" fill="#f8fafc" stroke="#e5e5e5"/>
    <text x="22" y="52" class="num">4,633</text><text x="22" y="76" class="lab">rows moved from PostgreSQL</text>
    <text x="22" y="104" class="sub">29 collections · every count matched</text>
  </g></g>
  <g transform="translate(916 10)"><g class="card c4">
    <rect class="bgc" width="282" height="130" rx="16" fill="#f8fafc" stroke="#e5e5e5"/>
    <text x="22" y="52" class="num">0</text><text x="22" y="76" class="lab">ledger differences</text>
    <text x="22" y="104" class="sub">stock = sum of movements, every item</text>
  </g></g>
</svg>
