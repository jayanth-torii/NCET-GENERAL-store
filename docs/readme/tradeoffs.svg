<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t">
<title id="t">Trade-offs: billing needs the internet, about 2.8 s bill saves at rush, backups must be planned</title>
<style>.h{font:800 30px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#0c2339;letter-spacing:-.5px}.t{font:700 18px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#0c2339}.p{font:500 15px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#404040}.pb{font-weight:700;fill:#0c2339}.s{font:500 13px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#737373}.eb{font:700 12px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:3px}.m{font:600 14px Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}.e{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}.card{fill:#f8fafc;stroke:#e2e8f0}.ln{stroke:#e2e8f0}.ink{fill:#0c2339}.trk{fill:#e5e7eb}@media (prefers-color-scheme: dark){.h,.t,.ink,.pb{fill:#f0f6fc}.p{fill:#c9d1d9}.s{fill:#8b949e}.card{fill:#161b22;stroke:#30363d}.ln{stroke:#30363d}.trk{fill:#30363d}}@keyframes a0{0%,0.00%{opacity:.15}10.00%,70%{opacity:1}85%,100%{opacity:.15}}.a0{animation:a0 2.4s ease-in-out 0s infinite}@keyframes a1{0%,20.00%{opacity:.15}30.00%,70%{opacity:1}85%,100%{opacity:.15}}.a1{animation:a1 2.4s ease-in-out 0s infinite}@keyframes a2{0%,40.00%{opacity:.15}50.00%,70%{opacity:1}85%,100%{opacity:.15}}.a2{animation:a2 2.4s ease-in-out 0s infinite}@keyframes a3{0%,60%{opacity:0}70%,95%{opacity:1}100%{opacity:0}}.a3{animation:a3 4.8s cubic-bezier(.2,.8,.2,1) 0s infinite}@keyframes a4{0%,100%{stroke-opacity:.25}50%{stroke-opacity:1}}.a4{animation:a4 3s ease-in-out 0s infinite}@keyframes a5{0%,1.67%{opacity:0;transform:translateY(12px)}6.67%,94.00%{opacity:1;transform:none}100%{opacity:0;transform:none}}.a5{animation:a5 12s cubic-bezier(.2,.8,.2,1) 0s infinite}@keyframes a6{to{transform:rotate(360deg)}}.a6{transform-origin:48px 48px;animation:a6 2.8s linear 0s infinite}@keyframes a7{0%,100%{stroke-opacity:.25}50%{stroke-opacity:1}}.a7{animation:a7 3s ease-in-out 1s infinite}@keyframes a8{0%,4.58%{opacity:0;transform:translateY(12px)}9.58%,94.00%{opacity:1;transform:none}100%{opacity:0;transform:none}}.a8{animation:a8 12s cubic-bezier(.2,.8,.2,1) 0s infinite}@keyframes a9{to{transform:rotate(360deg)}}.a9{transform-origin:78px 62px;animation:a9 3s linear 0s infinite}@keyframes a10{0%,100%{stroke-opacity:.25}50%{stroke-opacity:1}}.a10{animation:a10 3s ease-in-out 2s infinite}@keyframes a11{0%,7.50%{opacity:0;transform:translateY(12px)}12.50%,94.00%{opacity:1;transform:none}100%{opacity:0;transform:none}}.a11{animation:a11 12s cubic-bezier(.2,.8,.2,1) 0s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}.mv{display:none}}</style>
<defs></defs>
<g transform="translate(0 6)"><g class="a5"><rect class="card" width="376" height="236" rx="18"/><rect class="a4" x="1" y="1" width="374" height="234" rx="17" fill="none" stroke="#d97706" stroke-width="2"/><g transform="translate(14 8)"><path class="a0" d="M38 56a10 10 0 0 1 20 0" transform="rotate(0)" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><path class="a1" d="M28 54a20 20 0 0 1 40 0" transform="rotate(0)" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><path class="a2" d="M18 52a30 30 0 0 1 60 0" transform="rotate(0)" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><circle cx="48" cy="62" r="4" fill="#d97706"/><g class="a3"><line x1="22" y1="70" x2="74" y2="24" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/></g></g><text x="24" y="128" class="t" style="font-size:19px">Billing needs the internet</text><text x="24" y="160" class="s" style="font-size:14px">Atlas is in the cloud: a campus outage</text><text x="24" y="184" class="s" style="font-size:14px">stops the counters. A replica set on the</text><text x="24" y="208" class="s" style="font-size:14px">store server fixes it — same code.</text></g></g>
<g transform="translate(412 6)"><g class="a8"><rect class="card" width="376" height="236" rx="18"/><rect class="a7" x="1" y="1" width="374" height="234" rx="17" fill="none" stroke="#0F4C81" stroke-width="2"/><g transform="translate(14 8)"><circle cx="48" cy="48" r="26" fill="none" stroke="#0F4C81" stroke-width="4"/><rect x="42" y="14" width="12" height="6" rx="2" fill="#0F4C81"/><g class="a6"><line x1="48" y1="48" x2="48" y2="30" stroke="#0F4C81" stroke-width="4" stroke-linecap="round"/></g><circle cx="48" cy="48" r="4" fill="#0F4C81"/></g><text x="24" y="128" class="t" style="font-size:19px">≈ 2.8 s save at rush (p95)</text><text x="24" y="160" class="s" style="font-size:14px">15–20 round trips to Atlas per bill,</text><text x="24" y="184" class="s" style="font-size:14px">31–218 ms each. The 300 ms target</text><text x="24" y="208" class="s" style="font-size:14px">assumed a local database.</text></g></g>
<g transform="translate(824 6)"><g class="a11"><rect class="card" width="376" height="236" rx="18"/><rect class="a10" x="1" y="1" width="374" height="234" rx="17" fill="none" stroke="#e11d48" stroke-width="2"/><g transform="translate(14 8)"><ellipse cx="48" cy="30" rx="24" ry="8" fill="#e11d48"/><path d="M24 30v34a24 8 0 0 0 48 0V30" fill="#e11d48" fill-opacity=".75"/><path d="M24 47a24 8 0 0 0 48 0" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><g class="a9"><path d="M68 62a10 10 0 1 1 10 10" fill="none" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round"/><path d="M78 67l0 5 5 0" fill="none" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round"/></g></g><text x="24" y="128" class="t" style="font-size:19px">Backups are on you</text><text x="24" y="160" class="s" style="font-size:14px">ops/backup.sh is PostgreSQL-only.</text><text x="24" y="184" class="s" style="font-size:14px">Free M0 clusters have no backups —</text><text x="24" y="208" class="s" style="font-size:14px">schedule a mongodump of ncet_store.</text></g></g>
</svg>
